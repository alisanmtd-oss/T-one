[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t-one-community-core"
version = "0.4.1"
description = "Local-first AI operating core for global e-commerce and B2B foreign trade."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "T One contributors" }]
keywords = ["ai-agents", "ecommerce", "b2b", "foreign-trade", "cross-border", "local-first", "multi-store", "data-boundaries"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alisanmtd-oss/T-one"
Issues = "https://github.com/alisanmtd-oss/T-one/issues"
Discussions = "https://github.com/alisanmtd-oss/T-one/discussions"

[tool.setuptools.packages.find]
include = ["ai_ecommerce_director*"]

[tool.setuptools.package-data]
"ai_ecommerce_director.knowledge_packs" = ["catalog.json"]
