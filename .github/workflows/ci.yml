name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public core
        run: python -m pip install .
      - name: Compile public core
        run: python -m compileall -q ai_ecommerce_director
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify public tree
        run: python scripts/verify_public_tree.py
